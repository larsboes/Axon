"$schema" = "schemas/schema.json"

[default]
description = "Expose offline native RoomPlan capture controls."
permissions = [
  "allow-cancel-capture",
  "allow-check-permissions",
  "allow-accept-pending",
  "allow-current-capture",
  "allow-import-legacy-reference",
  "allow-reject-pending",
  "allow-is-available",
  "allow-request-permissions",
  "allow-preview-reference",
  "allow-start-capture",
  "allow-stop-capture",
]

[[permission]]
identifier = "allow-preview-reference"
description = "Open the imported USDZ reference in the native iOS preview."
commands.allow = ["previewReference"]

[[permission]]
identifier = "allow-start-capture"
description = "Start an offline RoomPlan capture."
commands.allow = ["startCapture"]

[[permission]]
identifier = "allow-stop-capture"
description = "Finish the active RoomPlan capture."
commands.allow = ["stopCapture"]

[[permission]]
identifier = "allow-cancel-capture"
description = "Cancel the active RoomPlan capture."
commands.allow = ["cancelCapture"]

[[permission]]
identifier = "allow-accept-pending"
description = "Accept a reviewed refinement revision as the current room revision."
commands.allow = ["acceptPending"]

[[permission]]
identifier = "allow-current-capture"
description = "Load the latest locally stored capture state."
commands.allow = ["currentCapture"]

[[permission]]
identifier = "allow-import-legacy-reference"
description = "Import the user-selected raw RoomPlan reference from local app storage."
commands.allow = ["importLegacyReference"]

[[permission]]
identifier = "allow-reject-pending"
description = "Reject a reviewed refinement revision without changing the current revision."
commands.allow = ["rejectPending"]

[[permission]]
identifier = "allow-is-available"
description = "Check whether RoomPlan is supported."
commands.allow = ["isAvailable"]

[[permission]]
identifier = "allow-check-permissions"
description = "Read camera permission state."
commands.allow = ["checkPermissions"]

[[permission]]
identifier = "allow-request-permissions"
description = "Request camera permission."
commands.allow = ["requestPermissions"]
