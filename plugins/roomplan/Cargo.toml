[package]
name = "tauri-plugin-roomplan"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
links = "tauri-plugin-roomplan"
description = "Native offline Apple RoomPlan capture for LifeOS."
publish = false

[lib]
name = "tauri_plugin_roomplan"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
roomplan-contract = { path = "../../libs/roomplan-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tauri = { version = "2.11.3" }
