"$schema" = "schemas/schema.json"

[default]
description = "Expose the optional on-device Apple language model."
permissions = ["allow-availability", "allow-respond"]

[[permission]]
identifier = "allow-availability"
description = "Read whether the on-device and Private Cloud Compute models can run on this device."
commands.allow = ["availability"]

[[permission]]
identifier = "allow-respond"
description = "Run one prompt on the on-device model. The prompt does not leave the device."
commands.allow = ["respond"]
