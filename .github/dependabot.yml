# Dependabot — freshness pull requests, replacing renovate.json5 (Q_AUDIT, 2026-09-02).
# Renovate needed a GitHub App that was never installed: measured 2026-09-02, the repository has
# zero Renovate pull requests and zero Renovate issues over its whole life. Dependabot needs no
# App.
#
# `cooldown: default-days: 0` is written out in EVERY block, and that is the ruling rather than
# noise. Dependabot applies a three-day cooldown to version updates even when `cooldown` is not
# configured — GitHub's own options reference states it — so omitting the key does not mean "no
# hold", it silently reinstates the one this change deleted. Patch first
# (README.md#patch-first): a hold that needs a human to end it is a hold that ends late.
#
# ONE THING NOT VERIFIED, stated rather than left to be discovered. dependabot-core treats 0 as
# "no cooldown" (Package::ReleaseCooldownOptions defaults every window to 0, and
# Job::CooldownDefinition passes an explicit 0 straight through), but the community JSON schema
# at json.schemastore.org/dependabot-2.0.json declares `default-days` minimum 1 while giving
# `semver-patch-days` minimum 0. GitHub's config validator is closed, so whether it accepts 0 is
# only answerable from the first run. CHECK IT: Insights -> Dependency graph -> Dependabot, on
# the first run after this lands. A rejected config opens no pull requests at all, which is a
# worse outcome than the three-day hold — if it is rejected, `default-days: 1` is the fallback.
#
# Daily, not weekly, for the same reason. A week-long batch is a week of unapplied security
# fixes, and the grouping below is what keeps that from being one pull request per crate.
#
# This file opens VERSION pull requests only. SECURITY updates are a repository setting, not a
# file setting: `gh api --method PUT repos/larsboes/Axon/automated-security-fixes`. That was run
# on 2026-09-02 and `security_and_analysis.dependabot_security_updates` now reads "enabled";
# this file alone would have left the reactive half switched off.
#
# `bun` is a first-class ecosystem, read from dependabot/dependabot-core upstream: a top-level
# bun/ directory, and bun/lib/dependabot/bun/package_manager.rb declaring ECOSYSTEM = "bun". It
# reads bun.lock directly, so the npm ecosystem is not needed. Both trees are verified present
# beside their package.json: dashboard/bun.lock and capabilities/soundscape/ui/bun.lock.
#
# capabilities/agentbox/Containerfile is deliberately NOT watched. Its only FROM is
# `FROM ${BASE_IMAGE}` over an ARG default, and whether Dependabot resolves that shape is
# unverified — an ecosystem block that may watch nothing is exactly the rot this change removes.
# That base image is a dated Debian snapshot tag, bumped by hand.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/dashboard"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 3
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/capabilities/soundscape/ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 3
    groups:
      soundscape-ui:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
