name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Several jobs set Bun up, and this file used to carry the pin literal once per job. One
# home per file instead: a bump touches this line, not however many jobs happen to exist.
# The pin itself lives in upstreams.toml [bun]; workflows cannot read TOML, so each repeats
# it as this env value — tools/check-bun-pin.sh is the gate that keeps them agreeing (#40).
env:
  BUN_VERSION: "1.3.14"

jobs:
  # rust-toolchain.toml pins both the compiler and these two components, so local
  # contributor commands and CI cannot silently lint with different releases.
  # Clippy compiles tests and feature-gated paths without running the
  # database-backed suites; those retain their explicit job below.
  rust-quality:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy (strict workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  cargo-tests:
    name: cargo test (hermetic)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Fetched artifacts: the crates.io registry and any git dependencies. Keyed
      # on the lockfile that determines them, so it is saved exactly when they change.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Compilation output. Keyed per-commit with a rolling restore-key:
      # actions/cache only writes on an exact-key miss, so a lockfile-based key
      # here would leave the cache frozen at the last dependency bump and never
      # pick up day-to-day compilation.
      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      # `postgres_tests` is the module name that IS the database-suite membership
      # (one selector across the workspace — see the 2026-08-25 suite rename).
      # Skipping it here proves the default checkout is testable without
      # Postgres or an Axon overlay; the explicit integration job below runs it.
      - name: cargo test, database suites excluded
        run: cargo test --workspace --locked -- --skip postgres_tests::

  cargo-postgres:
    name: cargo test postgres_tests
    needs: cargo-tests
    runs-on: ubuntu-latest

    # These suites resolve the same connection their binaries use. They fail
    # rather than skip when the database is absent, so only this explicit
    # integration job starts the pinned synthetic service.
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: axon
          POSTGRES_PASSWORD: axon
          POSTGRES_DB: axon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axon -d axon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The hermetic job has already populated these exact per-commit keys.
      # Restoring them keeps the explicit integration boundary from paying for
      # a second compilation of the same Rust crates.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: cargo test postgres_tests
        env:
          SCOUTING_TEST_DATABASE_URL: postgresql://axon:axon@127.0.0.1:5432/axon
          TRANSIT_TEST_DATABASE_URL: postgresql://axon:axon@127.0.0.1:5432/axon
          COMMS_TEST_DATABASE_URL: postgresql://axon:axon@127.0.0.1:5432/axon
          FINANCE_TEST_DATABASE_URL: postgresql://axon:axon@127.0.0.1:5432/axon
          TASKS_TEST_DATABASE_URL: postgresql://axon:axon@127.0.0.1:5432/axon
          PLACES_TEST_DATABASE_URL: postgresql://axon:axon@127.0.0.1:5432/axon
        run: cargo test --workspace --locked -- postgres_tests::

  # One rootward `bun test`, not a list of directories. The list said ./tools/ and
  # Packs/axon/evals/, which is how dashboard/vite/comms-proxy-auth.test.ts and
  # libs/overlay/overlay.test.ts came to run nowhere: both were written, committed, and
  # never once executed by CI. bun discovers *.test.ts itself and skips node_modules, so a
  # test file added anywhere is gated by existing (Axon#116). No install step: every one of
  # these imports bun:test, node builtins and local sources only, which is what keeps a
  # dependency-free runner honest.
  bun-tests:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun test
        run: bun test

      # Every tools/*.test.sh, discovered rather than listed — a hand-list is how a committed
      # test comes to run nowhere (the Axon#116 shape, again). They all drive real scripts
      # against throwaway roots under /tmp, and this job has bun on PATH for the ones
      # (service-runner, doctor-driving) that need it. Ran as Bazel sh_test targets until
      # PRD Q44 (2026-08-25) retired Bazel; this loop is their one home since.
      #
      # toolchain-scope.test.sh is excluded with a date: measured 2026-08-26, it fails
      # identically at main outside the Bazel sandbox it was written under (4 scope checks;
      # 'fixturedb' reads n/a-here), so it was only ever green inside the sandbox — the
      # false-green shape this repo documents. Tracked as a carried defect in the PRD; the
      # exclusion dies when the suite is fixed.
      - name: shell tests
        run: |
          set -uo pipefail
          failed=""
          for t in tools/*.test.sh; do
            [ "$t" = "tools/toolchain-scope.test.sh" ] && continue
            echo "::group::$t"
            bash "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "shell tests FAILED:$failed" >&2
            exit 1
          fi

  # Svelte type checks, local-only until 2026-07 and dashboard-only until now: a type
  # regression could land on main unseen (Axon#41), and a capability that grows its own UI
  # was unchecked from the day it landed (Axon#139 — the knowledge-graph UI carried six
  # errors while this workflow reported green).
  #
  # The set is discovered, never listed: `tools/discover-ui-packages` reads committed
  # package metadata, so a capability that grows a UI tomorrow enters this job without
  # anyone editing this file. A hand-list of capability names would close today's instance
  # and reopen the class.
  ui-check:
    name: bun run check (every discovered UI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # vitePreprocess() resolves the package's Vite config to run the style preprocessors,
      # and the dashboard's derives its dev proxy table from `tools/capability.sh registry`,
      # which hard-fails without <overlay>/config/machine.toml. Every <style> block then
      # reports that failure, so the first run of this job came back with 31 errors in 31
      # files — one per file, none of them type errors.
      #
      # A runner IS a machine, and Axon's contract is that a machine has an overlay, so the
      # honest fix is to give it the minimal one rather than to make the config tolerate its
      # absence. No axon.local.toml is written: with none present, paths.sh falls back to
      # axon.toml's shipped default (~/.axon-overlay), which is what this creates.
      # `capabilities = []` is deliberate — the registry then returns just the spine, which
      # is all a type check needs. Shape: schemas/machine.toml.example.
      - name: Minimal overlay for the config read
        run: |
          mkdir -p "$HOME/.axon-overlay/config"
          cat > "$HOME/.axon-overlay/config/machine.toml" <<'TOML'
          os = "linux"
          container_runtime = "docker"
          capabilities = []
          TOML

      # Two calls on purpose: the first prints every package and its verdict into the log,
      # including the skipped ones, so "not checked" is visible rather than absent. The
      # second is the machine-readable set, and it emits nothing when the first found a
      # violation — a refused package must not leave a loop reporting success over reduced
      # coverage.
      - name: Discover checkable UI packages
        run: tools/discover-ui-packages

      # Every package runs even after one fails: stopping at the first would hide how much
      # of the repository is actually broken behind whichever directory sorted first.
      - name: bun run check
        run: |
          set -uo pipefail
          failed=""
          for dir in $(tools/discover-ui-packages --dirs); do
            echo "::group::$dir"
            # A committed lockfile proves what we resolve, not that its lifecycle hooks are safe.
            # UI checks do not need install scripts, so leave that attack surface closed in CI.
            if (cd "$dir" && bun install --frozen-lockfile --ignore-scripts && bun run check); then
              echo "$dir: ok"
            else
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "ui-check FAILED:$failed" >&2
            exit 1
          fi

  # Repo-level gates, run directly rather than through tools/doctor (Axon#41).
  #
  # Why the scripts and not `doctor`: most of doctor's checks are machine-level — overlay
  # reachability, machine.toml, declared state mounts, upstream network — and a fresh clone
  # has none of them. Invoking the gate scripts is the same source of truth without that
  # baggage; doctor delegates to these identical scripts locally, so there is still one
  # implementation per rule.
  #
  # tools/self check runs here now. It used to read `tools/capability.sh registry`, which merges
  # this machine's machine.toml overrides and hard-fails without one -- so its answer was
  # machine-specific by construction and it stayed a doctor-only check (Axon#7). It reads the
  # service.toml manifests directly since, which makes the committed artifact reproducible from a
  # fresh clone and this the right place for it. Bun is set up for that one step; the other two
  # gates are pure shell.
  repo-gates:
    name: repo gates (labels, tracked inputs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generator inputs are tracked
        run: tools/check-generator-inputs-tracked.sh
      - name: ARCHITECTURE.md is fresh
        run: tools/check-architecture-fresh.sh
      - name: service.toml manifests are well-formed
        run: tools/check-service-tomls.sh
      - name: Manifest requires= references resolve
        run: tools/check-manifest-integrity.sh
      - name: No document cites its own path
        run: tools/check-doc-self-references.sh
      - name: One bun pin across its homes
        run: tools/check-bun-pin.sh
      - name: Publication hygiene
        run: tools/check-publication-hygiene.sh
      - name: Bun dependency installs do not run lifecycle hooks
        run: tools/check-bun-install-policy.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: self.json is current
        run: tools/self check
      # Runs here rather than as an sh_test: it drives the whole tools/doctor, and a Bazel
      # sandbox that under-declares doctor's inputs makes the persistence check return early
      # and the test pass over an empty report — green for the wrong reason.
      - name: doctor reports orphan units, and only orphan units
        run: tools/persistence-orphans.test.sh
