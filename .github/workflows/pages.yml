name: Pages

# Publish the self-model as the repository's landing surface (#14). The page is generated from
# self.json, which is generated from the manifests — so a fact that is not declared somewhere in
# this tree cannot appear on it, the same reason ARCHITECTURE.md is generated rather than written.
#
# The freshness gate below is the load-bearing part. self.json is a committed artifact, so it can
# be behind the manifests it describes; publishing from a stale one would put confident, wrong
# facts on a public page. `tools/self check` fails the job before anything is built, which is
# #14's "the build fails rather than publishing when its inputs are stale" — a gate, not a hope.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one mid-flight: a cancelled deploy can leave Pages
# serving a half-published state, which is worse than serving the previous page a minute longer.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the page
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # paths.sh resolves the overlay before anything else runs; with no axon.local.toml it falls
      # back to axon.toml's shipped default. Same minimal seed ci.yml and upstream-watch use.
      - name: Minimal overlay for path resolution
        run: |
          mkdir -p "$HOME/.axon-overlay/config"
          cat > "$HOME/.axon-overlay/config/machine.toml" <<'TOML'
          os = "linux"
          container_runtime = "docker"
          capabilities = []
          TOML

      # The gate. A stale self.json means the page would describe a tree that no longer exists.
      # Deliberately before the build, so a stale input costs a fast failure rather than a
      # published lie.
      - name: self.json is current
        run: tools/self check

      - name: Generate
        run: tools/generate-site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
