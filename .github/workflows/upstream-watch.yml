name: upstream-watch

# Watch pinned upstreams for newer releases past their cooldown so a bump stays a
# deliberate, audited act (README.md#dependency-verdicts-and-provenance and README.md#pins-and-cooldown) instead of something noticed by
# accident. This never bumps anything, and it opens nothing: the backlog is ISAs
# (README.md#the-backlog-is-isas), so drift is reported to the run's job summary and the run goes
# red. A red scheduled run is the notification; a tracker entry would be a second system of record
# saying the same thing with no falsifier attached.
# ci.yml has no schedule; the only other scheduled workflow is codeql.yml, which runs
# two hours earlier so the two never contend for a runner. The drift check
# is tools/upstream-checker (the same gate doctor and axon-status use) — one
# implementation per rule, not a second copy here.

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays ~06:23 UTC (off-peak; weekly matches release cadence)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: upstream drift check
    runs-on: ubuntu-latest
    steps:
      - name: Check out Axon
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # paths.sh resolves the overlay; with no axon.local.toml it falls back to
      # axon.toml's shipped default (~/.axon-overlay). upstream-checker reads only
      # repo manifests, but seed the minimal overlay so paths.sh is satisfied —
      # same approach ci.yml's svelte-check job uses. Shape: schemas/machine.toml.example.
      - name: Minimal overlay for path resolution
        run: |
          mkdir -p "$HOME/.axon-overlay/config"
          cat > "$HOME/.axon-overlay/config/machine.toml" <<'TOML'
          os = "linux"
          container_runtime = "docker"
          capabilities = []
          TOML

      # gh is preinstalled on ubuntu runners; GH_TOKEN lets upstream-checker's
      # gh_latest() query /releases/latest without hitting anonymous rate limits.
      - name: Check upstreams for drift
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          tools/upstream-checker | tee /tmp/upstream-report.txt || true
          tools/upstream-checker --json > /tmp/upstream.json 2>/dev/null || true
          # `warn` is the checker's "this entry is owed something" status: cooldown passed, the
          # audit window, a pair it cannot order, or a release it could not resolve. Entries whose
          # pin a release cannot describe at all are `na`, not `warn` (upstreams.toml `pin_kind`),
          # so they stay out of this selection — they were ten of the seventeen warnings this
          # workflow reported weekly, and none of them was ever actionable (#38). Selecting on
          # any "newer:" note instead matched entries the same report marks
          # `🔴 IN COOLDOWN, do NOT bump yet`, and then titled them past cooldown — seventeen of
          # twenty on the first real run. Entries inside cooldown are `ok` and stay out: waiting
          # is the correct action there, and paging someone for it teaches them to ignore this.
          jq -r '[ .entries[]? | select(.status == "warn") | .name ]' /tmp/upstream.json > /tmp/names.json 2>/dev/null || echo '[]' > /tmp/names.json
          {
            echo "count=$(jq -r 'length' /tmp/names.json)"
            echo "names=$(jq -r 'join(", ")' /tmp/names.json)"
          } >> "$GITHUB_OUTPUT"

      # Values cross into the shell as environment variables rather than ${{ }} interpolation.
      # An expression pasted straight into a `run:` block is executed by the shell, so a manifest
      # section name is enough to inject with; env is the form that cannot.
      - name: Report drift
        if: steps.check.outputs.count != '0'
        env:
          DRIFT_COUNT: ${{ steps.check.outputs.count }}
          DRIFT_NAMES: ${{ steps.check.outputs.names }}
        run: |
          set -u
          {
            echo "## upstream drift: $DRIFT_COUNT pin(s) need attention"
            echo
            echo "**$DRIFT_NAMES**"
            echo
            echo "Audit the delta (\`tools/audit\`) and bump the pin per README.md#dependency-verdicts-and-provenance"
            echo "and README.md#pins-and-cooldown — never auto-pull. A pin still inside its cooldown is not"
            echo "listed here: waiting is the correct action, so it is \`ok\`, not a finding."
            echo
            echo '```'
            cat /tmp/upstream-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Red on purpose. A green run that quietly hides drift teaches everyone to ignore the
          # summary, which is the failure the old weekly issue also had once it stopped refreshing.
          # Anything worth carrying past this run becomes a claim under `## Features` in ISA.md.
          echo "upstream drift: $DRIFT_COUNT pin(s) past cooldown — see the job summary" >&2
          exit 1
