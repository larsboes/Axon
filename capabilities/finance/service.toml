# finance — reviewed imports, journal projections, budgets and subscriptions.
kind        = "process"
name        = "finance"
command     = ["target/release/finance-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "finance-server"]
port        = "8090"
health_path = "/health"
ready_path  = "/ready"   # availability is judged on this, not on liveness (#126)
autostart   = "true"
# `/finance` is a dashboard route, so only `/finance/api` is proxied to this process.
# Without this the uniform rule in vite.config.ts claims the whole `/finance` prefix and
# the page becomes unreachable — the same trap trips documented (#136).
proxy_api_only = "true"

# Selects the separately installed accounting engine. This scalar is also the
# toolchain scope: hosts that enable Finance must provide the pinned engine.
ledger = "hledger"

# No `requires`: subscriptions, candidates and the two projections live in the
# shared SQLite file this process opens itself, so there is no database service to
# start first (PRD Q45).
