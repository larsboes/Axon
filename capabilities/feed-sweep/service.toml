# See schemas/service.toml.example for the field reference.
#
# The first manifest to declare `schedule`. The field landed in c3458ee with launchd and systemd
# backends, a shared duration parser and a schema gate, and nothing declaring it — so nothing had
# ever proved the path end to end. Writing this found two things a feature without a consumer
# could not have shown: the gate required a `port` of every kind = "process" manifest, which a
# job that exits can never have, and comms' own scan aborted the whole run when one source
# rate-limited, which is survivable while a human clicks a button and fatal on a timer.
kind     = "process"
name     = "feed-sweep"
# `bun` first, not a launcher script that execs it. service-runner.sh builds the generated unit's
# PATH from the interpreter it can see in command[0], and a launcher hides that: the first run
# through launchd died on `exec: bun: not found`, exit 127.
command  = ["bun", "run", "tools/feed-sweep.ts"]

# Six hours. Both live sources publish on a slower cycle than that — GitHub's trending page is
# daily and the arXiv listing settles once a day — so this is already oversampling; the value is
# a ceiling on staleness, not a guess at their cadence. Short enough that opening the dashboard
# never shows a day-old feed, long enough that a source rate-limiting one run has recovered long
# before the next.
schedule = "6h"

# No `port`, and the gate now refuses one alongside a schedule: this runs, collects, and exits.
# Nothing can reach a process that is not there, and a port would put an entry in the dashboard's
# proxy table pointing at exactly that.

# The contract it calls, not the code it shares (README.md#schemas-and-dependency-direction).
# `requires` keeps the two enabled together, so a machine cannot end up scheduling a sweep
# against a capability it does not have.
requires = ["comms"]
