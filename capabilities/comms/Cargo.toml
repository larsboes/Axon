[package]
name = "comms"
version = "0.1.0"
edition = "2021"
description = "Mail/media pipeline: reviewed Gmail triage plus share-link media ingest (metadata + transcript + summary), Postgres-backed."
publish = false

# Inert here, and deliberately so: libs/axon-config and libs/axon-server are
# `#[path]`-included, and their env-mutating unit tests hide behind this feature
# so they never run inside a consumer's test binary. Declaring it is what stops
# every build printing unexpected_cfgs.
[features]
standalone-tests = []

[lib]
name = "comms"
path = "src/lib.rs"

[[bin]]
name = "comms"
path = "src/main.rs"

# comms-server: async (tokio + axum) HTTP surface consumed by a dashboard
# panel. Mirrors capabilities/scouting's scout-server split -- the CLI (`comms`)
# carries no async runtime, only this bin does. See
# dashboard/README.md.
[[bin]]
name = "comms-server"
path = "src/server.rs"

[[bin]]
name = "comms-extraction-eval"
path = "src/extraction_eval_main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }
thiserror = "1.0"
# Sync client (not tokio-postgres) -- matches reqwest's "blocking" feature;
# the `comms` CLI path carries no async runtime, only comms-server does.
postgres = "0.19"
# feed_items PK is the sha256 of the canonical URL (store::feed_id). sha2 is
# already in this workspace's resolved Cargo.lock (transitive today), so this
# reuses a pinned dep rather than hand-rolling SHA-256.
sha2 = "0.10"
# Gmail returns message bodies base64url-encoded, and the digest path is the
# first thing here that reads one. Already resolved in this crate's Cargo.lock
# (transitive today), so naming it reuses a pinned dep rather than hand-rolling
# a decoder -- the same reasoning as sha2 above.
base64 = "0.22"
# comms-server only:
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
xberg = { version = "=1.0.5", features = ["html", "pdf"] }
