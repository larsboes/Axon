# backup — the scheduled run of every capability's backup contract.
#
# This existed as a hand-written LaunchAgent for weeks and tools/doctor called it an orphan on
# every run: a unit under ~/Library/LaunchAgents that no manifest owned, so nothing versioned its
# schedule and a machine rebuild would have lost it silently. The advice doctor printed was
# `remove-persistence`, which would have deleted the only scheduled backup on the machine. The
# check was right about the shape and wrong about the remedy, and the remedy is this file.
#
# It named ONE capability — `backup.sh store` — while three declare a contract. tools/backup-all.sh
# derives the set from the manifests instead, so a fourth capability declaring `backup_target` is
# backed up because it declared it, not because someone remembered to edit a plist.
kind     = "process"
name     = "backup"
command  = ["tools/backup-all.sh"]

# 24h, not the old unit's 13:00. `schedule` accepts a duration and deliberately not a cron
# expression (schemas/service.toml.example: both backends want a duration anyway, and a second
# scheduling language in a manifest is a language to translate out of). The wall-clock hour was
# never load-bearing — what `backup_advise_days = "1"` asks for is a daily run, and an interval
# delivers that. What is gained is that the first run comes ~1 minute after boot rather than a
# whole interval later, which is exactly the gap that left this machine with `runs = 0` after a
# reboot landed past 13:00.
schedule = "24h"
