# See schemas/service.toml.example for the field contract.
name         = "pihole"
image        = "pihole/pihole"
# ROLLING, not a pin (Q_DEPIN, 2026-09-02). capabilities/container-refresh pulls this daily
# and recreates the container when the digest moves. The declared tag names a channel; the
# running digest is the version fact (`docker inspect pihole --format '{{.Image}}'`).
tag          = "latest"

# Pi-hole needs original client addresses and direct DNS binding.
network_mode = "host"
cap_add      = ["NET_ADMIN"]

volumes      = ["data/pihole:/etc/pihole"]
env_file     = "config/pihole.env"

# Runtime state and query history are private overlay data.
backup_container_paths = ["/etc/pihole"]
backup_target = "backup-target"
backup_retain = "14"
