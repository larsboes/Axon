# places — canonical place registry, geocode cache, and the map layer endpoints.
kind        = "process"
name        = "places"
command     = ["target/release/places-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "places-server"]
port        = "8093"
health_path = "/health"
ready_path  = "/ready"

requires = ["postgres"]
