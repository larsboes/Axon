[package]
name = "places"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canonical place registry, cached Nominatim geocoder, and the spend/travel/people map layers."
publish = false

[lib]
name = "places"
path = "src/lib.rs"

[[bin]]
name = "places-server"
path = "src/main.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-server = { path = "../../libs/axon-server" }
axon-store = { path = "../../libs/axon-store" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it. Blocking, driven from spawn_blocking, same as every
# store-owning capability.
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
# Raw Amex export parsing for `backfill amex`; the same crate finance's import
# pipeline uses, so quoting and embedded newlines behave identically.
csv = "1.4"
# The candidate fingerprint is SHA-256 over the exact input tuple
# capabilities/finance/src/import.rs hashes; sha2 keeps the two byte-identical.
sha2 = "0.10"
# Outbound HTTP to Nominatim and transit's suggest surface; the blocking client,
# matching capabilities/transit/src/hafas.rs.
reqwest = { version = "0.12", features = ["blocking", "json"] }
