[package]
name = "punctuality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Empirical rail punctuality: aggregates published Deutsche Bahn stop history into per-station reliability statistics."
publish = false

[lib]
name = "punctuality"
path = "src/lib.rs"

# punctuality-cli, not punctuality: capabilities/punctuality/punctuality is the shell
# entry point this capability puts on PATH (README.md#placement-guide), and a Bazel target
# named after it would collide with that file inside the same package. Same reason
# capabilities/comms names its binary comms-cli.
[[bin]]
name = "punctuality-cli"
path = "src/main.rs"

# punctuality-server: the HTTP contract capabilities/transit reads this through, since a
# capability depends on another's surface and never its code (README.md#schemas-and-dependency-direction). The one
# place in this crate that needs an async runtime -- ingest and the CLI are batch jobs.
[[bin]]
name = "punctuality-server"
path = "src/server.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-server = { path = "../../libs/axon-server" }
axon-store = { path = "../../libs/axon-store" }
route-manifest = { path = "../../libs/route-manifest" }
# arrow-rs (upstreams.toml [arrow-rs]) -- the parquet reader. Pure Rust, which is the
# reason it is here rather than an embedded database: see
# capabilities/punctuality/README.md.
parquet = "=59.1.0"
arrow = "=59.1.0"

# Sync client, matching scouting/transit: this crate has no async runtime and does not
# need one -- ingest is a batch job and the CLI is a batch job.
postgres = "0.19"
# The sync pool for that client; see upstreams.toml [r2d2]. axon-store exposes
# both the migration gate and the pool through one explicit crate dependency.
r2d2 = "0.8"
r2d2_postgres = "0.18"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# punctuality-server only. Same versions capabilities/transit pins for transit-server.
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
