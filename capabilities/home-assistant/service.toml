# home-assistant — capability service definition.
# Field reference: schemas/service.toml.example. Single-line TOML only (tools/lib/toml.sh).
#
# Image: the official Home Assistant container on ghcr — which is what the family node has
# been running all along. This pointed at the Docker Hub mirror until 2026-07-26 for one
# reason only: service-runner.sh's apple-container branch prefixed `docker.io/`
# unconditionally, so a ghcr reference became docker.io/ghcr.io/… and the field could not name
# any other registry. That branch was made conditional on 2026-07-26 and deleted outright on
# 2026-09-02 with apple-container itself (Q75) — service-runner.sh now passes the
# reference through as written. The tag below is unaffected either way: it names the artifact
# that actually runs rather than a mirror of it.
name         = "homeassistant"
image        = "ghcr.io/home-assistant/home-assistant"
tag          = "stable"     # ROLLING, not a pin (Q77, 2026-09-02). `stable` is Home
                            # Assistant's own release channel: it moves to each new stable
                            # release, and capabilities/container-refresh pulls it daily and
                            # recreates this container when the digest moves. The declared tag
                            # names a channel; the running digest is the only version fact
                            # (`docker inspect homeassistant --format '{{.Image}}'`).
network_mode = "host"       # required: LAN mDNS discovery of Hue/Shelly/ESPHome (repo ADR). host mode
                            # publishes no ports — HA binds :8123 on the host directly. Runner support added
                            # 2026-07-16 (service-runner.sh + schema network_mode field).
# /config is the 14 MB that cannot be rebuilt, so it lives in the overlay under config/
# rather than data/: the overlay's default-deny .gitignore then tracks the yaml by explicit
# allow and leaves .storage and secrets.yaml ignored, without a rule per exception.
#
# The recorder database gets its own mount, and the split is the whole point. It is ~1.1 GB
# of telemetry: it must not reach git (data/ is ignored wholesale by the overlay) and it must
# not reach the NAS (backup_paths lists config/ only), because history nobody would restore
# would crowd out the config somebody would. It cannot simply live outside the container's
# mounts either — `recorder: db_url:` names a path INSIDE the container, so an unmounted one
# would leave HA quietly starting a fresh database and losing seven months of history.
#
# The two absolute paths are the machine's, not the overlay's, and both were carried by the
# compose stack this capability takes over from: /run/dbus is what HA's Bluetooth
# integration talks to (active on this house alongside hue, shelly and thread — dropping it
# would have looked like a clean migration and quietly killed BLE), /etc/localtime keeps the
# container's clock on the host's zone.
volumes      = ["config/home-assistant:/config", "data/home-assistant/recorder:/recorder", "/run/dbus:/run/dbus:ro", "/etc/localtime:/etc/localtime:ro"]

# The compose stack this capability replaced ran with `privileged: true`, which is every
# capability the kernel has. What the software actually asks for is two, by name, and it
# says so itself: habluetooth logs "Add NET_ADMIN and NET_RAW capabilities" and disables
# automatic adapter recovery without them. Granting those two is a reduction, not a port.
# Bare array line, no inline comment (toml_array contract).
cap_add      = ["NET_ADMIN", "NET_RAW"]
env_file     = "config/home-assistant.env"

# --- backup (tools/backup.sh) ---
# Read from inside the container, not from the host. HA runs as root and owns .storage
# that way -- the auth store, the user database, core.config_entries -- so a host-side
# rsync as the invoking user fails on precisely the files a restore would need. Covers
# /config only: /recorder is mounted but deliberately absent here.
# Bare array line, no inline comment (toml_array contract).
backup_container_paths = ["/config"]
# A separate backup role, not the node HA runs on. Real coordinates live in the overlay.
backup_target = "backup-target"
backup_retain = "14"

# host-networking blocker RESOLVED 2026-07-16: added an optional `network_mode` field to
# schemas/service.toml.example + service-runner.sh (backward-compatible — bridged capabilities
# that omit it are unchanged). `network_mode = "host"` above wires HA's LAN discovery.
