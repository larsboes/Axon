# soundscape — host process, not a container. Shape: schemas/service.toml.example.
#
# autostart = false: nothing depends on this being up, and a soundscape that starts
# itself on boot is a machine that makes noise decisions nobody asked for. The
# dashboard brings it up when its surface is opened, which is what axon-status is for.
#
# The panel is this same port: the binary serves the built UI bundle alongside its
# own API, so the surface arrives and leaves with the capability (README.md#three-architectural-nouns)
# rather than living in the spine shell.
kind        = "process"
name        = "soundscape"
command     = ["bazel-bin/capabilities/soundscape/soundscape"]
build       = ["bazel", "build", "//capabilities/soundscape:soundscape", "//capabilities/soundscape/ui:bundle"]
port        = "8088"
health_path = "/health"
autostart   = "false"
panel_port  = "8088"
panel_path  = "/"
