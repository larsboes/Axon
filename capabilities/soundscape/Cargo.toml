[package]
name = "soundscape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The conductor: what should be playing, and the state that survives a reload. The synth itself runs in the browser -- see capabilities/soundscape/README.md."
publish = false

[[bin]]
name = "soundscape"
path = "src/main.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-server = { path = "../../libs/axon-server" }
route-manifest = { path = "../../libs/route-manifest" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
