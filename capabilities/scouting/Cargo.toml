[package]
name = "scouting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Generic opportunity-discovery pipeline (events/scholarships/etc): scrape, embed, score against an interest profile, rank."
publish = false

[lib]
name = "scouting"
path = "src/lib.rs"

[[bin]]
name = "scout"
path = "src/main.rs"

# scout-server: async (tokio + axum), reopens the prior "no HTTP server,
# zero consumers" call now that dashboard is a named consumer — see
# dashboard/README.md.
[[bin]]
name = "scout-server"
path = "src/server.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-inference = { path = "../../libs/inference" }
axon-server = { path = "../../libs/axon-server" }
axon-store = { path = "../../libs/axon-store" }
markdown-root = { path = "../../libs/markdown-root" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }
thiserror = "1.0"
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it. Blocking, matching reqwest's "blocking" feature
# above -- scout's CLI path carries no async runtime, only scout-server does.
rusqlite = { version = "0.40", features = ["bundled"] }
# One-directional: scouting depends on transit, never the reverse (no cycle).
# adapters/transit_fare.rs implements SourceAdapter using transit::hafas +
# transit::store -- same "implement SourceAdapter, add one match-arm in
# main.rs" extension pattern every other adapter already follows (see
# README's "Extending it"), just sourced from a sibling capability's crate
# instead of a new HTTP client written inline.
transit = { version = "0.1.0", path = "../transit" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
