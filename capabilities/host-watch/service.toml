# See schemas/service.toml.example for the field reference.
#
# The host watch (Axon#177): one pass over the machine's own vital signs, then exit. It
# writes a `tasks` record per finding and nothing at all when the machine is healthy —
# `requires = ["tasks"]` because that hand-off IS the alert surface, not a convenience.
#
# Hourly, and the number is measured rather than assumed. The expensive half is the
# storage scan it shells out to, which is 6.6s wall and almost entirely I/O wait on this
# machine — 0.2% of an hour. The cheap half is `ps`. Anything slower than hourly makes
# the runaway check pointless: the incident that produced this capability ran for 3h29m
# of CPU before a human noticed, and a watcher that reports it the next morning has only
# written the postmortem.
kind     = "process"
name     = "host-watch"
# `bun` first, not the tools/host-watch launcher: service-runner.sh derives the generated
# unit's PATH from command[0], and a launcher script would hide the interpreter (the same
# reason feed-sweep and sparpreis-watch spell out the interpreter here).
command  = ["bun", "run", "tools/host-watch.ts"]
schedule = "1h"

# No `port`: it runs, observes, and exits. `schedule` and `autostart` are mutually
# exclusive and the runner refuses a manifest carrying both — this is a job, not a service.
requires = ["tasks"]
