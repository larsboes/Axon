[package]
name = "calendar"
version = "0.1.0"
edition = "2021"
description = "Axon's calendar layer: availability windows, scoped rhythms, events."
publish = false

[features]
standalone-tests = []

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar-server"
path = "src/server.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postgres = "0.19"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }
