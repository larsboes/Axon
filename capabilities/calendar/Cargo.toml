[package]
name = "calendar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axon's calendar layer: availability windows, scoped rhythms, events."
publish = false

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar-server"
path = "src/server.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-server = { path = "../../libs/axon-server" }
axon-store = { path = "../../libs/axon-store" }
content-item = { path = "../../libs/content-item" }
markdown-root = { path = "../../libs/markdown-root" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does not
# depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has the
# measurement that settled it.
rusqlite.workspace = true
tokio = { workspace = true, features = ["full"] }
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }
reqwest = { workspace = true, features = ["json", "gzip", "blocking", "query", "form"] }
