[package]
name = "calendar"
version = "0.1.0"
edition = "2021"
description = "Axon's calendar layer: availability windows, scoped rhythms, events."
publish = false

[features]
standalone-tests = []

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar-server"
path = "src/server.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postgres = "0.19"
# The sync pool for that client. `Store::open` cost a fresh connection and its auth
# every call; upstreams.toml [r2d2] carries the verdict and why not deadpool/bb8.
r2d2 = "0.8"
r2d2_postgres = "0.18"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }
