# calendar — Axon's calendar layer: availability windows, scoped rhythms, events.
kind        = "process"
name        = "calendar"
command     = ["target/release/calendar-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "calendar-server"]
port        = "8087"
health_path = "/health"
ready_path  = "/ready"   # availability is judged on this, not on liveness (#126)
# `/calendar` is the dashboard workspace, so only `/calendar/api` is proxied
# to this process (with `/calendar` stripped).
proxy_api_only = "true"

requires = ["postgres"]
