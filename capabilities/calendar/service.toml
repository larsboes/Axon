# calendar — Axon's calendar layer: availability windows, scoped rhythms, events.
kind        = "process"
name        = "calendar"
command     = ["bazel-bin/capabilities/calendar/calendar-server"]
build       = ["bazel", "build", "//capabilities/calendar:calendar-server"]
port        = "8087"
health_path = "/health"
# `/calendar` is the dashboard workspace, so only `/calendar/api` is proxied
# to this process (with `/calendar` stripped).
proxy_api_only = "true"

requires = ["postgres"]
