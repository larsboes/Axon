[package]
name = "trips"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Persistent cross-capability trip plans and itinerary item references."
publish = false

[lib]
name = "trips"
path = "src/lib.rs"

[[bin]]
name = "trips-server"
path = "src/server.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-server = { path = "../../libs/axon-server" }
axon-store = { path = "../../libs/axon-store" }
# The vault projection: `markdown_root::projection` owns placement, containment and
# the header; src/projection.rs owns only what a plan looks like (PRD Q49).
markdown-root = { path = "../../libs/markdown-root" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does
# not depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has
# the measurement that settled it.
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
schemars = "1.2.2"
# Was loopback-only with no TLS backend; the Kiwi flight adapter (kiwi.rs)
# speaks HTTPS to mcp.kiwi.com, so the default TLS stack is back in. Version
# matched to capabilities/calendar and transit so the workspace resolves one reqwest.
reqwest = { version = "0.13", features = ["blocking", "json"] }
# Flight-segment times arrive naive airport-local; station-time resolves them
# to UTC via country + island-airport lookups (PRD X1/F2).
station-time = { path = "../../libs/station-time" }
thiserror = "1.0"

[[bin]]
name = "trips"
path = "src/bin/trips-cli.rs"
