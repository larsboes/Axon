# ============================================================
# REGELN der Musterwohnung. Erfunden, aber vollstaendig: jede Regel, die `clearance.rs` lesen
# kann, steht hier einmal, damit ein fehlender Schluessel als Fehler auffaellt und nicht als
# uebersprungene Pruefung.
#
# `bett_zugang_zweite_seite = 40` — anders als die reale Wohnung, die dort 0 fuehrt. Der
# Unterschied ist Absicht: er beweist, dass die Zahl aus der Datei kommt und nicht aus dem Code.
# ============================================================

