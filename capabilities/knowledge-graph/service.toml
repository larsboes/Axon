# knowledge-graph — serves the graphify code-dependency graph as a REST API,
# for the dashboard and for AI agents. Shape: schemas/service.toml.example.
#
# Reads graphify-out/graph.json from the repo root on every API call — the graph
# is rebuilt by tools/graphify.sh and this always serves the current version.
# No separate data store: the graph data is the canonical graphify output.
#
# No panel and no build: this capability had a second SvelteKit app of its own,
# and its browser view now lives on the dashboard's self-model page (/self),
# which reaches this API through the shell's derived proxy. One graph, one
# surface. See README.md#where-the-browser-view-went.
kind         = "process"
name         = "knowledge-graph"
command      = ["bun", "capabilities/knowledge-graph/server.ts"]
port         = "4244"
health_path  = "/api/graph/stats"
idle_timeout = "300"
