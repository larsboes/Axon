[package]
name = "tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owned task records with provenance back to whatever observed them."
publish = false

[lib]
name = "tasks"
path = "src/lib.rs"

[[bin]]
name = "tasks-server"
path = "src/server.rs"

[dependencies]
axon-config = { path = "../../libs/axon-config" }
axon-server = { path = "../../libs/axon-server" }
axon-store = { path = "../../libs/axon-store" }
content-item = { path = "../../libs/content-item" }
route-manifest = { path = "../../libs/route-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The database, after PRD Q45 retired Postgres. Bundled so the deployment does
# not depend on whichever SQLite the host ships; upstreams.toml [rusqlite] has
# the measurement that settled it.
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
