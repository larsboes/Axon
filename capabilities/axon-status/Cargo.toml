[package]
name = "axon-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aggregates live health from Axon's own HTTP-surfaced capabilities (transit-server, scout-server) for dashboard. Not LifeOS Pulse -- see capabilities/axon-status/README.md."
publish = false

[[bin]]
name = "axon-status"
path = "src/main.rs"

[dependencies]
# The shared SQLite file, for one read: host-watch's findings. That capability is a
# scheduled job with no port of its own (the manifest schema refuses one), so the
# machine's always-on status surface publishes them — the same shape /backups already
# has with tools/backup.sh's receipts. Read-only: host-watch owns the table.
axon-config = { path = "../../libs/axon-config" }
axon-store = { path = "../../libs/axon-store" }
axon-server = { path = "../../libs/axon-server" }
route-manifest = { path = "../../libs/route-manifest" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
# The shell's front door (src/proxy.rs): ServeDir/ServeFile for the built bundle, and
# ServiceExt::oneshot to hand a request to them from inside a fallback handler rather than
# mounting them as the fallback outright -- the proxy has to get first refusal on the path.
tower = { version = "0.4", features = ["util"] }   # ServiceExt::oneshot
tower-http = { version = "0.6", features = ["fs"] }
