[package]
name = "axon-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aggregates live health from Axon's own HTTP-surfaced capabilities (transit-server, scout-server) for dashboard. Not LifeOS Pulse -- see capabilities/axon-status/README.md."
publish = false

[[bin]]
name = "axon-status"
path = "src/main.rs"

[dependencies]
axon-server = { path = "../../libs/axon-server" }
route-manifest = { path = "../../libs/route-manifest" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
