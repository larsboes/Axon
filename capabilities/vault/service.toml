# vault — the Obsidian vault read as data, over HTTP. Field reference:
# schemas/service.toml.example.
#
# The capability was a read-only CLI with no manifest until PRD Q48 (2026-08-27)
# retired `tasks` and gave the Action kind back to `Projects/**/Tasks/`. The
# dashboard's decision ladder needed an HTTP source for band 620, and the vault
# is where the data now lives — so the reader that already existed grew a second
# front end rather than a second capability growing a copy of it.
kind        = "process"
name        = "vault"
command     = ["target/release/vault-server"]
build       = ["cargo", "build", "--locked", "--release", "--bin", "vault-server"]

# 8094, the next free slot after places' 8093. Not 8089: that was `tasks`, and a
# freed port re-used in the same change is a port where a stale process answers
# for the capability that replaced it. 8092 is spoken for by the private
# overlay's interior capability (capabilities/places/src/config.rs).
port        = "8094"
health_path = "/health"

# Availability is judged here, not on liveness (#126). The vault lives in iCloud
# Drive: the process can be perfectly healthy while the folder it exists to read
# is not there yet.
ready_path  = "/ready"

# No `requires`: the vault is a directory this process opens, named by the
# overlay's config/knowledge.toml. Nothing has to be started first.
#
# No `autostart` either. The ladder starts it on demand the same way it starts
# every other read surface, and a server whose only job is to read files a human
# edits has nothing to do while nobody is looking.
