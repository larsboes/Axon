[package]
name = "ai-client"
version = "0.1.0"
edition = "2021"
description = "LLM inference router: local OpenAI-compatible endpoint or cloud Gemini, with priority-based fallback."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
