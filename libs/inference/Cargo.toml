[package]
name = "axon-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One home for which model answers which job on this machine: backends declared once, roles that name backend + model + input prefixes, and a machine-level backend override. Capabilities ask for a role, never a backend."
publish = false

[lib]
name = "axon_inference"
path = "src/lib.rs"

# This crate owns its HTTP and JSON dependencies directly.
[dependencies]
# Outbound HTTP goes through one factory: the user-agent, the timeout and the
# connection pool are decided there, not at each call site (libs/axon-http).
axon-http = { path = "../axon-http" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }
