[package]
name = "axon-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One home for which model answers which job on this machine: backends declared once, roles that name backend + model + input prefixes, and a machine-level backend override. Capabilities ask for a role, never a backend."
publish = false

[lib]
name = "axon_inference"
path = "src/lib.rs"

# Unlike libs/axon-config this is not std-only -- it speaks HTTP and JSON. Every
# consumer already carries these three, so the `#[path]` include adds nothing to
# a capability's dependency resolution; the versions here exist for the
# standalone build and must stay in step with the crate universe.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
