[package]
name = "axon-summarize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One adaptive digest engine: the shape follows the source's length, 'more detailed' is a rung on that same ladder, and a Mermaid answer is validated before it is stored."
publish = false

[lib]
name = "axon_summarize"
path = "src/lib.rs"

# This crate owns its HTTP and JSON dependencies directly.
[dependencies]
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
