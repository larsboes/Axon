[package]
name = "axon-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One home for when a capability's schema migration runs: once per process per (database, schema), behind a cross-process advisory lock."
publish = false

[lib]
name = "axon_store"
path = "src/lib.rs"

[dependencies]
postgres = "0.19"
# The sync pool, matching the sync client. See upstreams.toml [r2d2] for why this
# rather than deadpool/bb8 -- those are async pools for tokio-postgres, and this
# repo's data layer is deliberately the blocking client driven from spawn_blocking.
r2d2 = "0.8"
r2d2_postgres = "0.18"
