[package]
name = "axon-store"
version = "0.1.0"
edition = "2021"
description = "One home for when a capability's schema migration runs: once per process per (database, schema), behind a cross-process advisory lock."
publish = false

[features]
# The test module is compiled in only for the standalone build, so
# //libs/axon-store:axon_store_test actually runs it. Consumers fold this file in
# by #[path] include and get the functions without the tests.
standalone-tests = []

[lib]
name = "axon_store"
path = "src/lib.rs"

# Deliberately only what every consumer already has — see the dependency rule in
# src/lib.rs. This file is compiled inside the consumer's crate, so anything
# listed here that a consumer lacks is a build break in that consumer, not here.
# All seven store-owning capabilities already pin postgres 0.19.
[dependencies]
postgres = "0.19"
