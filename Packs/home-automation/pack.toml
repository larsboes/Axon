# See schemas/pack.toml.example for the field reference.
name         = "home-automation"
description  = "Home Assistant capability tooling — materialize templated automations from an instance var map, fetch pinned custom components, query the Fritz!Box, network/DNS ops."
skills       = ["homectl", "fritz", "ha-cli", "pihole", "netmon", "esphome", "ha-deploy", "energy-dashboard", "ha-dashboard", "ha-dashgen"]
license      = "MIT"
capabilities = ["home-assistant"]
personal     = ["config/home-assistant.vars"]

# NOT DEPLOYED ANYWHERE RIGHT NOW (2026-09-11, Lars: "not deployed AT ALL currently"), and that
# is a decision this file deliberately no longer enforces. It used to carry a `# pi: REFUSED` line
# that packs-pi honoured as a veto; that was retired 2026-09-17, because a harness-specific rule
# does not belong in a manifest the schema requires to stay harness-neutral, and because it made
# the `full` profile mean something other than "all packs".
#
# The decision now lives where the decision belongs: `profiles.toml`. `full` is an explicit list
# that omits this Pack, and activating the `home` profile is the switch that brings it back.
# Nothing here needs editing to deploy it — see README.md#activate.
