# See schemas/pack.toml.example for the field reference.
# Five moves on one decision, in the order a decision usually needs them: produce the options
# (diverge), make it precise (crystallize), weigh them (council), attack the one you picked
# (red-team), explain the failure when it lands anyway (root-cause).
# agents/ is a Claude-Code-only convention and deliberately absent from this manifest —
# see README.md#the-agents and schemas/pack.toml.example.
name        = "deliberation"
description = "Five ways to work a decision: produce candidate options when there are none, crystallize an unstructured mess into a precise document, convene a council that debates the options, red-team the proposal that wins, and root-cause the failure when one happens anyway."
skills      = ["diverge", "crystallize", "council", "red-team", "root-cause"]
license     = "MIT"
