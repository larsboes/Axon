# --- home-server container dependencies ------------------------------------
# Earlier deployment evidence used floating tags (:stable, :latest, :2, :2.7) with no entry here,
# so nothing watched them and nothing recorded what was running — while scripts/update.sh
# called `docker compose pull` on every deploy. Every pin below is the version read out of the
# LIVE container on 2026-07-26, not a registry guess, and digest-confirmed where the registry
# allowed it. They enter as entries first so upstream-checker watches them; the capability
# migration that takes the containers over is separate work.
#
# One caveat that applies to all of them: an official-image version tag is not a byte pin.
# Docker Hub rebuilds under the same tag — proven here on mosquitto, where the running
# sha256:a908c65c and the current 2.1.2-alpine sha256:6f8d8a94 both report 2.1.2. The digest
# comments are what make byte identity recoverable.

