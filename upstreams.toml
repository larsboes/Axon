# Every external project Axon touches. No entry, no entry.
# verdict = "adopt" | "contribute" | "overlay" | "fork" | "build" | "inspiration" | "quarry" | "reject"
#   Preference order: adopt > contribute > overlay > fork (last resort). fork is a PR vehicle only.
# pin = the exact ref consumed at the moment the `why` below it was written. Empty until first
#   consumption. For a tool a package manager owns -- brew, uv, cargo install -- this is a
#   RECORD, not a claim about this machine: capabilities/host-patch upgrades brew nightly, so
#   the installed version moves ahead of the pin by design (README.md#patch-first).
# license / url / why = the rest of the verdict. `why` carries the audit.
#
# This file is a verdict register and nothing else. pin_kind, tracked_by and installed_probe
#   stood here until 2026-09-02 (Q74). All three existed to describe an entry's opt-out from
#   renovate.json5's release watch, and renovate.json5 is deleted. installed_probe recorded how
#   to ask a host which version it really had; under patch-first the answer is whatever brew
#   installed last night, so the question no longer has a stable answer to compare against.
#   What each deleted line said is in this file's git history at that date, for a re-decision
#   that needs it.
# No cooldown. A release is adopted when it has been read (README.md#patch-first). Six `why`
#   strings below still cite README.md#pins-and-cooldown: they record adoptions decided under the
#   hold, they are left as written, and that section is now #patch-first.
# No adopt/overlay/fork verdict lands without an audit. That is a rule for the human editing this
#   file -- since 2026-08-28 (PRD Q41) no script enforces it, and README.md#dependency-verdicts-and-provenance says so plainly.

