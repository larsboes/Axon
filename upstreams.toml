pin = "2.1.2-alpine"    # the running container reports 2.1.2 but its digest (sha256:a908c65c) matches NO current tag: the tag `2` it was pulled by has since been rebuilt to sha256:6f8d8a94, now also carrying 2.1.2-alpine and 2.1-alpine. Adopting this tag means taking the newer 2.1.2 build on next restart — a base-layer change, deliberate instead of silent. No bare 2.1.2 tag exists; 2.1.x ships -alpine only
