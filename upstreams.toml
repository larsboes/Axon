why = "the document extraction layer capabilities/comms is meant to sit on (#77), audited 2026-07-31 and adopted in direction only -- the Cargo dependency is deliberately absent until cooldown clears. Benchmarked out-of-tree against the 15 stored article URLs with the same fetched bytes going to both sides: xberg returns more text than the built-in tag stripper on all 15, and rescues the cases the strip returns nothing usable for (a client-rendered arXiv HTML page 0 -> 129k chars, a GitHub tree view 15 -> 12k, blog.rust-lang.org 75 -> 40k). It is an extractor and NOT a readability cleaner, exactly as #77 suspected: the short-line share of its output runs 0.03-1.00 with a median near 0.36, so navigation and share widgets survive. That is acceptable here only because #86 landed first -- extraction produces raw, capabilities/comms/src/normalize.rs produces clean -- and the benchmark is what proved that split is required rather than merely tidy. Three findings shaped the pin: 1.0.0's `pdf` feature does not resolve at all (its pdf_oxide 0.3.76 wants fax ^0.3 and crates.io tops out at 0.2.7), which is why the pin is 1.0.5 rather than the older, sooner-eligible release; the crate is pure Rust as claimed, with no tesseract/openssl-sys/candle in the tree, although the Homebrew formula pulls tesseract and installs an EMPTY keg (two 0-byte files, no binary), so the CLI is not a usable install path; and the surface is large at 320 unique crates with html+pdf enabled versus 158 on default features. MSRV 1.91 sits under the 1.96 that rules_rust 0.71.1 pins, so the Bazel side is clear. Six releases in five days plus a yanked 5.0.0-rc.32 predating 1.0.0 is why this waits out the full window instead of being bumped on sight."

