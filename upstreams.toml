# Every external project Axon touches. No entry, no entry.
# verdict = "adopt" | "contribute" | "overlay" | "fork" | "build" | "inspiration" | "quarry" | "reject"
#   Preference order: adopt > contribute > overlay > fork (last resort). fork is a PR vehicle only.
# pin = exact ref/commit consumed (empty until first consumption)
# pin_kind = "commit" | "image" | "monorepo" | "hosted" | "dataset"
#   Only for a pin that a GitHub release cannot describe, naming which shape it is instead. Absent
#   means a release tag, which tools/upstream-checker compares against releases/latest. Declaring a
#   kind turns that comparison off for the entry -- so every pin_kind requires tracked_by, because
#   opting out of one check is not opting out of thinking about staleness.
# tracked_by = one line: what keeps this entry current, given that releases/latest cannot.
# cooldown: new upstream releases wait out a hold window (axon.toml [upstream]) before adoption unless fixing an exposed vuln.
# No adopt/overlay/fork verdict lands without an audit (checked by tools/upstream-checker, M2).

