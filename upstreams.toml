[apple-container]
url = "https://github.com/apple/container"
verdict = "adopt"
license = "Apache-2.0"
pin = "1.2.2"           # what is INSTALLED and running (`container --version`, verified 2026-08-19), read off the machine rather than a registry listing -- a signed .pkg the operator installs by hand, so upstream-checker watches drift here, it does not own the update. The pin deliberately does NOT move ahead of the machine: a pin claiming a version the host is not running is the exact failure Axon#54 exists to catch, so it bumps in the change that verifies `container --version`, never before. That guard earned itself this time -- between the install and this bump the checker read "pin says 1.0.0, machine has 1.2.2". AUDIT 2026-08-19 -- the 2026-08-03 review of 1.1.0/1.2.0 DEFERRED adoption to "the next release", which is this one; that audit stands and is not repeated. Installer signature verified before running: Developer ID Installer: Apple Inc. - Containerization (UPBK2H6LZM), notarized, trusted timestamp 2026-08-08 01:47:20 +0000. The four advisories the pin was sitting inside all clear at 1.2.2: GHSA-wg28-286f-56v6 and GHSA-2v2q-4q35-h585 (<= 1.1.0), GHSA-xwgf-4rc5-p4m4 and GHSA-g57j-434g-5xj2 (< 1.2.0). ONE UPGRADE TRAP, found the hard way and worth more than the version number: `container system stop` followed by `start` replaces the apiserver and NOT the plugin helpers. After the .pkg installed, `container-network-vmnet` and `container-core-images` were still the 1.0.0 processes from two days earlier while apiserver and container-runtime-linux were 1.2.2, and every bootstrap failed with `no available interface strategy for network default, plugin=container-network-vmnet variant=nil` -- a message that names the network and hides the skew. The vmnet helper logs an allocated attachment with a real IP immediately before the failure, so the network is fine and reading the error as a network problem sends you the wrong way. What fixes it: run `container system stop` a SECOND time once the apiserver is already new, which does then stop the helpers, then `start`. Check `ps` for `libexec/container/plugins` start times, not just `container system status`, which reports only the apiserver version. Restore parity verified rather than assumed: postgres came back on the SAME 17.9-alpine container (not recreated -- `service-runner.sh status` prints the DECLARED 17.10 tag, `container list` prints the running one, and only the second answers this question), with 288 tables and 482,520 rows, identical to the counts taken before the upgrade and to that morning's backup receipt. Same six services healthy after as before. Previous pin: 1.0.0, verified 2026-08-03
installed_probe = "container --version"   # the runtime every containerised capability boots on; its `why` already said the pin is read off the machine
why = "the container runtime <overlay>/config/machine.toml already names (container_runtime = \"apple-container\"), registered here now that a capability depends on more than `run`: each container is its own VM rather than a shared kernel, which is the isolation claim agentbox actually rests on, and `container network create --internal` gives a host-only network with no external route -- the egress control the writeup left explicitly out of scope. Apple-signed component, no third-party daemon, which is the install story a sovereignty review asks about"

