verdict = "adopt"
license = "Apache-2.0"
pin = "2026.7.4"        # latest stable 2026-07-24; adopted 2026-08-01 after cooldown. Trivy reduced 156 findings to 111; the image-scoped remainder expires 2026-08-15 under Axon#184.
why = "home-automation core for capabilities/home-assistant. Adopt rather than hand-roll; Axon's value is the pinned, reproducible and host-portable deployment around it"

[esphome]
url = "https://github.com/esphome/esphome"
verdict = "reject"
license = "MIT + GPL-3.0 (dual)"
pin = "2026.5.3"        # ghcr.io/esphome/esphome, read from `esphome version` in the running container. Pinned rather than removed so it cannot drift while running
why = "REJECTED and removed 2026-07-26: the container ran with ZERO device configs — /opt/homeautomation/esphome holds only an empty .esphome cache and the repo dir only a .gitkeep. A container, a port and an update path for no devices. Re-adopt honestly if ESPHome hardware actually arrives"

