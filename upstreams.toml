why = "nothing tracks this entry, deliberately, since 2026-08-30: no consumer means no staleness to track. It is the geometry engine behind the interior capability, read while it still lived in the private overlay (it moved here 2026-08-30, PRD Q59): rooms, walls, openings, levels and a browser view, driven over MCP. Adopted rather than rebuilt after it returned 22.700000000000003 m2 for a polygon measured on site at 22,7. What it does NOT provide is the reason the capability exists: its check_collisions is documented as an axis-aligned bounding-box overlap test between item footprints, and every clearance rule this capability enforces is about the space that stays EMPTY — room to walk, to reach, to open a door, to let light past. None of those can be written as an overlap test, so src/clearance.ts is ours and the engine underneath is theirs. CONSUMER LOST 2026-08-30, which is why the verdict is inspiration and not adopt. The TypeScript capability spawned @pascal-app/mcp via bunx and pinned the version in its package.json on purpose -- \"a floating range would let the geometry engine change under a verified room model\". The Rust rewrite links nothing and shells out to nothing: the whole engine is capabilities/interior/src/geometry.rs, an exact Felzenszwalb/Huttenlocher distance transform plus a maximum-bottleneck search, both ours. Nothing in Axon installs this now. What survives is the shape of the read, not the code -- and the 22.700000000000003 above, which is still the reason to prefer integer centimetres to floats for a measured room"
