why = "Björn Buchhold's reference implementation for the M3 2026 Karlsruhe talk on SLM fine-tuning for agentic AI, read 2026-08-16 at 50d1f70 and then deleted locally. Two things it argues that capabilities/learning needs. First, its result: a fine-tuned 4B Qwen3 matched a frontier model on text-to-SQL, with SFT, schema-agnostic SFT and GRPO/RLVR compared side by side -- external evidence for the oMLX bet in that capability's ISA, from someone else's experiment rather than our own hope. Second, its evaluation shape: correctness is scored by EXECUTING the generated SQL, not by comparing strings, which is the same move punctuality makes by being the number a model has to beat. capabilities/learning currently specifies freeze-on-compile and no way at all to say whether a compiled guide is any good; execution-scored evaluation is the missing rung. Not adopted: the training code is AWS-specific, undeclared-licence and explicitly not a library."

