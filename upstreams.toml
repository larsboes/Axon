pin = "trixie-20260713-slim"   # 2026-07-14, 14d old on 2026-07-28 = the far edge of the cooldown window. arm64 digest sha256:8b5033c95ca60cdffb0e0f4c446e5f714e82d8960a9ef4153c0eaf13e988b0ea. Dated tag, not the rolling `trixie-slim`, so a rebuild is a decision
