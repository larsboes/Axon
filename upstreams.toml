license = "MIT"
why = "Considered as a third capabilities/transit DocumentBackend beside builtin and xberg, and MEASURED on 2026-08-29 the way xberg was measured on 2026-08-11: a rendered DB-style journey table, OCR'd, compared against what the seam needs. Rejected because it reads text lines, not layout. Apple Vision's VNRecognizeTextRequest returns text observations, so a table comes back COLUMN-MAJOR -- `Datum / 29.08. / Ab / 08:14 / 11:05 / Bahnhof / Koeln Hbf / Frankfurt(M) Hbf / An / ...` -- with the two legs interleaved and unrecoverable. That is the exact failure capabilities/transit/src/document.rs was written to escape, and worse than pdf_extract, which at least keeps one leg's fields adjacent. `--md` is an output format for auge's own results and reconstructs nothing. What DID hold: German is perfect (Koeln Hbf, Muenchen Hbf) with no language pack, so if this slot ever wants an OCR engine rather than a layout reader, this is the one -- and reconstructing rows from bounding boxes would be Axon writing the layout logic, which is the code the apfel adoption just deleted elsewhere. Also note the trust delta: apfel is in homebrew-core, auge needs a personal tap. SECOND MEASUREMENT OF THE SAME ENGINE, 2026-08-31, on the Notability corpus and recorded here rather than in a new entry because it is the same VNRecognizeTextRequest: Apple Vision is EXCELLENT on printed German prose and USELESS on mathematical notation. It reads = as - (q- 10nC, d-2am) and cannot express a fraction at all, so a page of formulas comes back as plausible-looking wrong text rather than as a failure -- which is worse than an error and is why PRD Q63 gives the ladder a third rung instead of stopping here. It won on text volume against Docling on 550 of 1,027 pairs on that corpus, so the weakness is specific to notation and not general. This is the OCR slot the paragraph above anticipated, and Q63 is where it is being decided."

