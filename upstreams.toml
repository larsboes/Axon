pin = "v0.83.0"         # 2026-07-29. Pinned 2026-07-31 at 2d old, INSIDE the 7d cooldown, and that is recorded rather than excused: the host had already self-updated to it via `pi update` roughly 15h after release, on a path no gate was watching. This pin documents an adoption that had already happened; it did not authorise one. Two targets consume it now — pi-linux-arm64.tar.gz for the box (sha256 b84f9016610c738dd9440df62f649880dbe9951db97a7ae936cbf292850e9802) and pi-darwin-arm64.tar.gz for the host install (sha256 147fc3c451ec543a15102af251ce316079c8fcadfe8ae4d3ffee202346e9bed9), both read from the release's SHA256SUMS and re-verified by downloading each asset. #126 is the gate that makes the NEXT bump go through a check instead of past one
