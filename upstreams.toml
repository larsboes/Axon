verdict = "adopt"
license = "CC-BY-4.0 (data, licensed by Deutsche Bahn; attribution required)"
pin = "monthly_processed_data/data-2025-11 .. data-2026-06"   # the monthly releases consumed, not a git ref: the code that produces them is irrelevant here, the published parquet files are the artifact. Files are immutable once published; a new month is a new file, never a rewrite of an old one
why = "historical German rail punctuality, the empirical baseline capabilities/punctuality is built on. Collected 4x/day from DB's own Station Data + Timetables APIs and republished monthly as parquet, so it is DB's data under DB's licence rather than a scrape. Chosen over calling the Timetables API directly because that answers 'what is delayed right now' and cannot be asked about last March -- history is the whole point here. Two properties the README states and the ingest must respect: coverage changes on 2025-11-02 (before it, only the ~100 largest stations; after, all ~5300), so mixing the two eras makes station coverage a confounder; and collection is 98.92% complete with 196 named missing hours, so an absent train never means 'did not run'. Schema broke once (2026-05: train_name split into train_number + line_number, all historical files reprocessed), which is why the pin names files rather than tracking a moving 'latest'"

[arrow-rs]
url = "https://github.com/apache/arrow-rs"
verdict = "adopt"
license = "Apache-2.0"
pin = "59.2.0"          # arrow + parquet crates. AUDIT 2026-08-19 -- 59.2.0 is 12d old, past the 7d hold and inside the 7-14d window that asks for an audit rather than a wait. Upstream declares no breaking changes. One fix lands on exactly the path capabilities/punctuality/src/ingest.rs uses: "support mask filtering across skipped pages", and that ingest reads through `ProjectionMask`. Two more are hardening in arrow-avro (VLQ overlong-varint bound, OCF block-size and item-count bounds) on a codec nothing here touches -- taken as free, not as the reason. Transitives moved with it: lz4_flex 0.13.1 -> 0.14.0 and a new num-bigint 0.5.1. Verified against real data rather than against the changelog: folding <overlay>/data/punctuality/raw/data-2026-06.parquet returns 14,752,336 rows, 0 skipped, 330,150 cells and 5,340 stations on BOTH 59.1.0 and 59.2.0 -- identical, which is what a patch bump on this reader should be. That comparison also found the reader has no test of its own: the crate's 29 unit tests cover the time maths and never open a parquet file, so this bump was checked by a throwaway harness against the operator's private monthly files. A fixture-based reader test belongs in the repo and is not written yet (previous pin: 59.1.0, released 2026-07-07, 20d old on 2026-07-28)
why = "the parquet reader capabilities/punctuality ingests with. Pure Rust, so it resolves through a normal crate.from_cargo block; the obvious alternative (DuckDB via duckdb-rs) would have pulled a bundled C++ embedded database into the dependency tree to run one GROUP BY, and its own CLI would have put the aggregation in SQL outside the type system. DuckDB stays a fine ad-hoc exploration tool, it is just not a dependency Axon has to carry. See capabilities/punctuality/README.md"

[xberg]
url = "https://github.com/xberg-io/xberg"
verdict = "adopt"
license = "MIT"
pin = "1.0.5"           # ADOPTED EARLY, inside the hold, on operator decision 2026-08-04. Published 2026-07-30, hold would have cleared 2026-08-06. Taken because capabilities/comms needed the pdf feature and the hold is a recommendation rather than a gate (README.md#pins-and-cooldown). The version adopted is the one that was audited: 1.0.5, not the 1.0.13 that shipped the same day unread.
why = "the document extraction layer capabilities/comms is meant to sit on (#77), audited 2026-07-31 and adopted in direction only -- the Cargo dependency is deliberately absent until cooldown clears. Benchmarked out-of-tree against the 15 stored article URLs with the same fetched bytes going to both sides: xberg returns more text than the built-in tag stripper on all 15, and rescues the cases the strip returns nothing usable for (a client-rendered arXiv HTML page 0 -> 129k chars, a GitHub tree view 15 -> 12k, blog.rust-lang.org 75 -> 40k). It is an extractor and NOT a readability cleaner, exactly as #77 suspected: the short-line share of its output runs 0.03-1.00 with a median near 0.36, so navigation and share widgets survive. That is acceptable here only because #86 landed first -- extraction produces raw, capabilities/comms/src/normalize.rs produces clean -- and the benchmark is what proved that split is required rather than merely tidy. Three findings shaped the pin: 1.0.0's `pdf` feature does not resolve at all (its pdf_oxide 0.3.76 wants fax ^0.3 and crates.io tops out at 0.2.7), which is why the pin is 1.0.5 rather than the older, sooner-eligible release; the crate is pure Rust as claimed, with no tesseract/openssl-sys/candle in the tree, although the Homebrew formula pulls tesseract and installs an EMPTY keg (two 0-byte files, no binary), so the CLI is not a usable install path; and the surface is large at 320 unique crates with html+pdf enabled versus 158 on default features. MSRV 1.91 sits under the 1.96 in rust-toolchain.toml, so the toolchain floor is clear. Six releases in five days plus a yanked 5.0.0-rc.32 predating 1.0.0 is why the pin does not follow head. CONSUMED 2026-08-04 for `pdf` only, behind capabilities/comms/src/extraction.rs's Extractor trait; HTML stays on the built-in extractor. Measured on adoption against real arXiv papers rather than the synthetic fixture: 2608.02599 (2026, two-column) extracts correct text in the wrong reading order, columns interleaved line by line; 0704.0001 (2007, Type1 fonts) drops every `c` -- 'Abstrat', 'Mihigan', 'quantum hromo dynamis' -- at 11.7s against 0.3s for the same paper as HTML. So this is the last rung before storing an abstract, never a replacement for arxiv.org/html or ar5iv, and `producer` is stored per item so a scrambled body is distinguishable from a clean one downstream."

[ar5iv]
url = "https://ar5iv.labs.arxiv.org"
verdict = "adopt"
license = "renders arXiv submissions; each paper keeps the licence its authors chose, exactly as on arxiv.org"
pin = "hosted-html-render"
why = "second HTML source for arXiv full text in capabilities/comms (#78), consulted only when arxiv.org/html answers 404. Measured 2026-08-04 across the 24 newest cs.AI/cs.LG/cs.CL papers: arxiv.org served HTML for 21, and ar5iv answered all three misses plus a 2007 paper, with real body text rather than a conversion stub. It is the older LaTeXML pipeline with much wider backfill, which is the shape of the gap. Adopted as a fetch target only: the response goes through the same extraction trait every other page does, so no provider markup or script is ever evaluated, and a failure costs an abstract rather than an error. It is a labs-grade host, which is why it is the fallback and never the first request. Together with arxiv.org it reduces the case for a PDF reader to papers with no LaTeX source at all -- scans and PDF-only submissions -- which is what xberg's pdf feature is for once its cooldown clears"

