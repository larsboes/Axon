why = "the database, after PRD Q45 (2026-08-27) retired Postgres. Adopted on measurement rather than preference: of 464 columns in the live instance 462 are SQLite-native (the two exceptions are a jsonb and an integer[], both TEXT here), no extension, enum, FTS index or LISTEN/NOTIFY is in use, all 9 partial indexes are btree and supported, and every ON CONFLICT (44), RETURNING (18) and window function in the tree is supported by the bundled SQLite. The write rate is 0.30 commits/s, so single-writer WAL with a busy_timeout is ample. Taken with the `bundled` feature so the deployment does not depend on whichever SQLite macOS or an Alpine image happens to ship -- the failure that avoids is a build that works on the developer's machine and loses a function on the host. The blocking API is the one this repo's data layer is written against (see [r2d2]), so the 134 sync call sites needed no async conversion"

