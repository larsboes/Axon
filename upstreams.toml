why = "private remote access plus `tailscale cert` for trusted HTTPS without distributing a private CA to every client. Chosen over NetBird for that capability; Tailnet Lock reduces coordination-server trust for key distribution but not its metadata visibility"

[netbird]
url = "https://github.com/netbirdio/netbird"
verdict = "reject"
license = "BSD-3-Clause (whole stack, control plane included)"
pin = ""                # nothing consumed
why = "REJECTED 2026-07-26 on capability, not merit — and it wins the licensing axis outright: the entire stack including the coordination server is BSD-3 and self-hostable as a single container since 0.65, where Tailscale's control plane is proprietary and self-hosting means the Headscale reimplementation. It loses on the one requirement that produced this design: there is no per-peer TLS certificate. netbirdio/netbird#5479 has been open since May 2024 with no maintainer response and no roadmap, both candidate paths (internal CA, Let's Encrypt DNS-PERSIST-01) are unshipped, and the only workaround today is their reverse proxy, which exposes the service publicly. Adopting it now would mean reintroducing the private CA that mkcert was rejected for. RE-ADOPT TRIGGER: `netbird cert` (or DNS-PERSIST-01) in a release — at which point self-hosting the control plane would also close the metadata exposure Tailnet Lock deliberately leaves open"

